<div class="configuration-container">
  <div class="header">
    <h1>Configuration</h1>
    <button class="btn btn-outline-danger" (click)="resetToDefault()">Reset to Default</button>
  </div>

  <div class="configuration-content">
    <!-- Entities Section -->
    <div class="section">
      <div class="section-header">
        <h2>Entities</h2>
      </div>

      <!-- New Entity Form -->
      <div class="form-container">
        <form (ngSubmit)="addNewEntity()" class="compact-form">
          <div class="form-row">
            <input type="text" [(ngModel)]="newEntity.name" name="newEntityName" placeholder="Entity Name" required>
            <input type="number" [(ngModel)]="newEntity.parentId" name="newEntityParentId" placeholder="Parent ID">
            <input type="text" [(ngModel)]="newEntity.description" name="newEntityDescription" placeholder="Description">
            <button type="submit" class="btn btn-sm btn-success">Add</button>
          </div>
          <div class="error-message" *ngIf="!isValidParentId(newEntity.parentId)">
            {{getParentIdError(newEntity.parentId)}}
          </div>
        </form>
      </div>

      <!-- Entities List -->
      <div class="list-container">
        <div *ngFor="let entity of entities" 
             class="item"
             [class.selected]="selectedEntity?.id === entity.id">
          <div class="item-content">
            <!-- Entity Display -->
            <div class="item-display" *ngIf="editingEntity?.id !== entity.id" (click)="selectEntity(entity)">
              <div class="item-header">
                <span class="name">{{entity.name}}</span>
                <div class="actions">
                  <button class="btn btn-sm btn-outline-primary" (click)="selectEntity(entity)">Fields</button>
                  <button class="btn btn-sm btn-outline-primary" (click)="startEditEntity(entity)">Edit</button>
                  <button class="btn btn-sm btn-outline-danger" (click)="deleteEntity(entity)">Delete</button>
                </div>
              </div>
              <div class="item-details">
                <span class="detail">ID: {{entity.id}}</span>
                <span class="detail">Parent: {{entity.parentId || 'None'}}</span>
                <span class="detail" *ngIf="entity.description">Description: {{entity.description}}</span>
              </div>
            </div>

            <!-- Entity Edit Form -->
            <div class="item-edit" *ngIf="editingEntity?.id === entity.id">
              <form (ngSubmit)="saveEntity()" class="compact-form">
                <div class="form-row">
                  <input type="text" [ngModel]="getEditingEntityName()" (ngModelChange)="setEditingEntityName($event)" name="name" required>
                  <input type="number" [ngModel]="getEditingEntityParentId()" (ngModelChange)="setEditingEntityParentId($event)" name="parentId">
                  <input type="text" [ngModel]="getEditingEntityDescription()" (ngModelChange)="setEditingEntityDescription($event)" name="description" placeholder="Description">
                  <div class="form-actions">
                    <button type="submit" class="btn btn-sm btn-success" [disabled]="!isValidParentId(getEditingEntityParentId())">Save</button>
                    <button type="button" class="btn btn-sm btn-secondary" (click)="cancelEditEntity()">Cancel</button>
                  </div>
                </div>
                <div class="error-message" *ngIf="!isValidParentId(getEditingEntityParentId())">
                  {{getParentIdError(getEditingEntityParentId())}}
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Fields Section -->
    <div class="section" *ngIf="selectedEntity">
      <div class="section-header">
        <h2>Fields for {{selectedEntity.name}}</h2>
      </div>

      <!-- New Field Form -->
      <div class="form-container">
        <form (ngSubmit)="addNewField()" class="compact-form">
          <div class="form-row">
            <input type="text" [(ngModel)]="newField.fieldName" name="newFieldName" placeholder="Field Name" required>
            <select [(ngModel)]="newField.dataType" name="newFieldType">
              <option value="string">String</option>
              <option value="number">Number</option>
              <option value="boolean">Boolean</option>
              <option value="date">Date</option>
            </select>
            <input type="text" [(ngModel)]="newField.description" name="newFieldDescription" placeholder="Description">
            <div class="checkbox-container">
              <input type="checkbox" [(ngModel)]="newField.isRequired" name="newFieldRequired">
              <label>Required</label>
            </div>
            <button type="submit" class="btn btn-sm btn-success">Add</button>
          </div>
        </form>
      </div>

      <!-- Fields List -->
      <div class="list-container">
        <div *ngFor="let field of entityFields | filterByEntityId:selectedEntity.id" 
             class="item">
          <div class="item-content">
            <div class="item-header">
              <input type="text" 
                     [value]="editingFields[field.id].fieldName" 
                     (input)="updateFieldProperty(field.id, 'fieldName', $any($event.target).value)"
                     class="field-input">
              <div class="actions">
                <button class="btn btn-sm btn-outline-danger" (click)="deleteField(field)">Delete</button>
              </div>
            </div>
            <div class="item-details">
              <select [value]="editingFields[field.id].dataType"
                      (change)="updateFieldProperty(field.id, 'dataType', $any($event.target).value)"
                      class="field-input">
                <option value="string">String</option>
                <option value="number">Number</option>
                <option value="boolean">Boolean</option>
                <option value="date">Date</option>
              </select>
              <input type="text" 
                     [value]="editingFields[field.id].description"
                     (input)="updateFieldProperty(field.id, 'description', $any($event.target).value)"
                     placeholder="Description"
                     class="field-input">
              <div class="checkbox-container">
                <input type="checkbox" 
                       [checked]="editingFields[field.id].isRequired"
                       (change)="updateFieldProperty(field.id, 'isRequired', $any($event.target).checked)">
                <label>Required</label>
              </div>
            </div>
          </div>
        </div>
        
        <div class="section-header">
          <div class="field-actions">
            <button class="btn btn-sm btn-success" (click)="saveAllFields()">Save All Changes</button>
            <button class="btn btn-sm btn-secondary" (click)="cancelFieldEdits()">Cancel Changes</button>
          </div>
        </div>
        
      </div>
    </div>
  </div>
</div>
